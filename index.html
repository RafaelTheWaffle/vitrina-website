<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Vitrina — Smash burgers · Tel Aviv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Allison&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&family=Archivo+Black&display=swap" rel="stylesheet">

<style>
  :root{
    --cream:#f1e8d2;
    --cream-2:#ebdfc1;
    --ink:#1a1410;
    --ink-2:#3a2e26;
    --red:#d12821;
    --red-dk:#a31a14;
    --pink:#ff8aa3;
    --blue:#2e8fd1;
    --peach:#f1b896;
    --mustard:#f3b734;
    --paper:#faf3e0;
    --line:rgba(26,20,16,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--cream);
    color:var(--ink);
    font:16px/1.55 "DM Sans", ui-sans-serif, system-ui, sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--red);color:var(--paper)}

  /* Paper grain / halftone speckle */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
    background-image:
      radial-gradient(rgba(26,20,16,.04) 1px, transparent 1px),
      radial-gradient(rgba(26,20,16,.025) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    mix-blend-mode:multiply;
    opacity:.55;
  }

  /* Typography */
  .display{font-family:"Anton", "Archivo Black", sans-serif;font-weight:400;line-height:.86;letter-spacing:-.01em;text-transform:uppercase}
  .script{font-family:"Allison", cursive;line-height:.85;font-weight:400}
  .mono{font-family:"Space Mono", ui-monospace, monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .black{font-family:"Archivo Black", sans-serif;letter-spacing:-.005em}

  h1,h2,h3,h4{margin:0}
  a{color:inherit;text-decoration:none}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 22px;border-radius:999px;
    background:var(--ink);color:var(--paper);
    font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;
    border:none;cursor:pointer;transition:transform .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn:hover{transform:translate(-1px,-2px);background:var(--red)}
  .btn--red{background:var(--red);color:var(--paper)}
  .btn--red:hover{background:var(--ink)}
  .btn--cream{background:var(--cream);color:var(--ink)}
  .btn--ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .btn--ghost:hover{background:var(--ink);color:var(--paper)}
  .btn .arrow{display:inline-block;transition:transform .2s ease}
  .btn:hover .arrow{transform:translateX(3px)}

  /* Layout */
  .wrap{max-width:1320px;margin:0 auto;padding:0 28px;position:relative;z-index:2}
  section{position:relative;z-index:2}

  /* MARQUEE */
  .marquee{
    background:var(--ink);color:var(--paper);
    border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
    overflow:hidden;white-space:nowrap;
    position:relative;z-index:5;
  }
  .marquee__track{
    display:inline-flex;align-items:center;gap:38px;
    padding:11px 0;
    animation:scroll 38s linear infinite;
    font-family:"Anton",sans-serif;font-size:18px;letter-spacing:.05em;
  }
  .marquee__dot{width:8px;height:8px;background:var(--red);border-radius:999px;display:inline-block}
  @keyframes scroll{
    from{transform:translateX(0)}
    to{transform:translateX(-50%)}
  }

  /* NAV */
  .nav{
    position:sticky;top:0;z-index:50;
    background:rgba(241,232,210,.86);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav__inner{display:flex;align-items:center;justify-content:space-between;height:68px}
  .nav__logo{font-family:"Allison",cursive;font-size:54px;line-height:.5;color:var(--red);transform:translateY(2px);letter-spacing:-.01em}
  .nav__links{display:flex;gap:28px;align-items:center}
  .nav__links a{font-weight:500;font-size:14px;position:relative}
  .nav__links a::after{
    content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--red);
    transform:scaleX(0);transform-origin:left;transition:transform .25s ease;
  }
  .nav__links a:hover::after{transform:scaleX(1)}
  .nav__right{display:flex;gap:14px;align-items:center}
  .nav__cart{
    width:42px;height:42px;border-radius:999px;background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    position:relative;font-size:16px;border:none;
  }
  .nav__cart .badge{
    position:absolute;top:-4px;right:-4px;background:var(--red);color:var(--paper);
    border-radius:999px;font-size:10px;font-weight:700;min-width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--cream);
  }
  .nav__burger{display:none;width:42px;height:42px;border-radius:999px;background:var(--ink);color:var(--paper);border:none;cursor:pointer;align-items:center;justify-content:center}

  /* HERO */
  .hero{padding:24px 0 60px;position:relative}
  .hero__grid{display:grid;grid-template-columns: 1.05fr .95fr;gap:30px;align-items:stretch}
  .hero__left{position:relative;padding-top:18px}
  .hero__eyebrow{display:inline-flex;align-items:center;gap:10px;padding:6px 12px;border:1.5px solid var(--ink);border-radius:999px;font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .hero__eyebrow span.dot{width:7px;height:7px;border-radius:999px;background:var(--red);box-shadow:0 0 0 3px rgba(209,40,33,.18);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(209,40,33,0)}}
  .hero__h1{font-family:"Anton",sans-serif;font-size: clamp(64px, 11.5vw, 184px);line-height:.86;letter-spacing:-.015em;text-transform:uppercase;margin-top:18px}
  .hero__h1 .it{font-style:italic;font-family:"DM Sans";font-weight:400;font-size:.55em;letter-spacing:0;text-transform:lowercase;color:var(--red);display:inline-block;transform:translateY(-.12em) rotate(-3deg)}
  .hero__h1 .crossed{position:relative;display:inline-block}
  .hero__h1 .crossed::after{
    content:"";position:absolute;left:-4%;right:-4%;top:54%;height:8px;background:var(--red);
    transform:rotate(-4deg);
  }
  .hero__sub{margin-top:22px;max-width:520px;font-size:17px;line-height:1.55;color:var(--ink-2)}
  .hero__cta{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .hero__meta{margin-top:36px;display:flex;gap:24px;flex-wrap:wrap;align-items:center}
  .hero__meta .item{display:flex;flex-direction:column;gap:2px}
  .hero__meta .item .k{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(26,20,16,.55)}
  .hero__meta .item .v{font-weight:700;font-size:14px}

  .hero__right{position:relative;display:grid;grid-template-rows: 1fr .65fr;gap:14px;min-height:560px}
  .hero__photo{
    position:relative;border-radius:24px;overflow:hidden;
    background-position:center;background-size:cover;background-repeat:no-repeat;
    box-shadow:0 28px 60px -28px rgba(26,20,16,.35);
  }
  .hero__photo--main{background-color:#ff8aa3}
  .hero__photo--main .overlay-script{
    position:absolute;left:6%;bottom:-6%;font-family:"Allison",cursive;color:var(--paper);
    font-size:clamp(120px,18vw,260px);line-height:.7;pointer-events:none;mix-blend-mode:screen;opacity:.96;
  }
  .hero__photo--main .badge-have{
    position:absolute;top:14px;left:14px;background:var(--ink);color:var(--paper);
    border-radius:999px;padding:9px 14px;font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase
  }
  .hero__bottom{display:grid;grid-template-columns: 1.2fr 1fr;gap:14px}
  .hero__photo--side{background-color:var(--blue)}
  .hero__photo--side .tag{
    position:absolute;left:14px;bottom:14px;background:var(--paper);color:var(--ink);
    padding:6px 10px;border-radius:6px;font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase
  }
  .hero__quote{
    background:var(--ink);color:var(--paper);border-radius:24px;padding:20px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .hero__quote .q{font-family:"Anton",sans-serif;font-size:24px;line-height:1;letter-spacing:.01em;text-transform:uppercase}
  .hero__quote .cite{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(250,243,224,.6);margin-top:10px}
  .hero__quote .stars{color:var(--mustard);font-size:14px;letter-spacing:2px;margin-top:auto}

  /* TICKER strip - "VITRINA" newspaper wrap */
  .vstrip{
    background:var(--red);color:var(--paper);
    padding:14px 0;overflow:hidden;
    transform:rotate(-1.2deg);margin:30px -40px;
    border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);
    box-shadow:0 6px 0 var(--ink);
  }
  .vstrip__track{
    display:flex;gap:28px;animation:scroll 28s linear infinite;white-space:nowrap;
    font-family:"Anton",sans-serif;font-style:italic;font-size:38px;letter-spacing:.04em;
  }
  .vstrip__track span{position:relative}
  .vstrip__track span::after{content:"★";color:var(--mustard);margin-left:28px;font-style:normal}

  /* SECTION HEADERS */
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin-bottom:36px;padding-top:90px}
  .section-head .left{max-width:760px}
  .section-head .eyebrow{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:10px}
  .section-head .eyebrow::before{content:"";width:24px;height:1.5px;background:var(--red)}
  .section-head h2{font-family:"Anton",sans-serif;font-size:clamp(48px,7vw,108px);line-height:.88;letter-spacing:-.01em;text-transform:uppercase;margin-top:12px}
  .section-head h2 .script{font-family:"Allison",cursive;color:var(--red);text-transform:none;font-size:1.4em;letter-spacing:0;display:inline-block;transform:translateY(.15em) rotate(-2deg);margin:0 -.04em}
  .section-head .right{padding-bottom:6px;max-width:340px;color:var(--ink-2);font-size:15px}

  /* MENU */
  .menu{position:relative;background:var(--cream);padding-bottom:80px}
  .menu__tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px;border-bottom:1.5px solid var(--ink);padding-bottom:0}
  .menu__tab{
    padding:12px 18px;border-radius:14px 14px 0 0;border:1.5px solid var(--ink);border-bottom:none;
    background:transparent;cursor:pointer;font-family:"Anton",sans-serif;font-size:18px;letter-spacing:.02em;text-transform:uppercase;
    color:var(--ink);transition:all .15s ease;margin-bottom:-1.5px;
  }
  .menu__tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
  .menu__tab:hover:not([aria-selected="true"]){background:var(--cream-2)}

  .menu__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .card{
    background:var(--paper);border:1.5px solid var(--ink);border-radius:18px;overflow:hidden;
    display:flex;flex-direction:column;position:relative;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .card:hover{transform:translate(-2px,-3px);box-shadow:6px 6px 0 var(--ink)}
  .card__media{aspect-ratio: 4/3;position:relative;overflow:hidden;background-size:cover;background-position:center}
  .card__media .tag{
    position:absolute;top:10px;left:10px;background:var(--ink);color:var(--paper);
    padding:4px 9px;border-radius:6px;font-family:"Space Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase
  }
  .card__media .tag.red{background:var(--red)}
  .card__media .tag.cream{background:var(--paper);color:var(--ink)}
  .card__body{padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px}
  .card__title{font-family:"Anton",sans-serif;font-size:28px;line-height:.95;text-transform:uppercase;letter-spacing:.005em;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .card__title .price{font-size:18px;color:var(--red)}
  .card__desc{font-size:13.5px;line-height:1.5;color:var(--ink-2)}
  .card__foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:14px;border-top:1px dashed var(--line)}
  .card__foot .add{
    appearance:none;border:none;background:var(--ink);color:var(--paper);
    padding:9px 16px;border-radius:999px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
  }
  .card__foot .add:hover{background:var(--red)}
  .card__foot .meta{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(26,20,16,.55)}
  .card.feat{grid-column:span 2}
  .card.feat .card__media{aspect-ratio: 16/9}
  .card.feat .card__title{font-size:42px}
  .card.bg{background:var(--red);color:var(--paper)}
  .card.bg .card__desc{color:rgba(250,243,224,.85)}
  .card.bg .card__title .price{color:var(--mustard)}
  .card.bg .card__foot{border-top-color:rgba(250,243,224,.25)}
  .card.bg .card__foot .add{background:var(--paper);color:var(--ink)}
  .card.bg .card__foot .add:hover{background:var(--mustard)}
  .card.bg .card__foot .meta{color:rgba(250,243,224,.6)}

  /* CALLOUT BANNER */
  .banner{
    background:var(--pink);color:var(--ink);
    border:2px solid var(--ink);border-radius:24px;
    padding:36px;margin-top:40px;
    display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;
    position:relative;overflow:hidden;
  }
  .banner h3{font-family:"Anton",sans-serif;font-size:clamp(36px,5vw,76px);line-height:.92;text-transform:uppercase;letter-spacing:-.005em}
  .banner h3 .script{font-family:"Allison",cursive;color:var(--red);text-transform:none;font-size:1.5em;letter-spacing:0;line-height:.5;display:inline-block;transform:translateY(.2em) rotate(-3deg)}
  .banner p{font-size:15px;max-width:46ch;color:var(--ink-2);margin:14px 0 0}
  .banner__photo{aspect-ratio:1;border-radius:18px;background-size:cover;background-position:center;border:2px solid var(--ink)}

  /* LOCATIONS */
  .locations{background:var(--ink);color:var(--paper);padding:70px 0 90px;margin-top:80px}
  .locations .section-head{padding-top:0}
  .locations .section-head h2{color:var(--paper)}
  .locations .section-head .eyebrow{color:var(--mustard)}
  .locations .section-head .eyebrow::before{background:var(--mustard)}
  .locations .section-head .right{color:rgba(250,243,224,.7)}

  .loc__grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .loc{
    background:var(--ink-2);border-radius:24px;overflow:hidden;
    border:1px solid rgba(250,243,224,.12);
    display:flex;flex-direction:column;
  }
  .loc__photo{aspect-ratio: 16/10;background-size:cover;background-position:center;position:relative}
  .loc__photo .num{position:absolute;top:18px;left:18px;font-family:"Anton",sans-serif;font-size:64px;line-height:.85;color:var(--paper);text-shadow:0 4px 14px rgba(0,0,0,.6)}
  .loc__photo .open{
    position:absolute;top:18px;right:18px;background:var(--paper);color:var(--ink);
    padding:6px 12px;border-radius:999px;font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    display:flex;align-items:center;gap:6px;font-weight:700;
  }
  .loc__photo .open .dot{width:6px;height:6px;background:#3aa86d;border-radius:999px;box-shadow:0 0 0 3px rgba(58,168,109,.3)}
  .loc__body{padding:24px}
  .loc__name{font-family:"Anton",sans-serif;font-size:40px;line-height:.95;text-transform:uppercase}
  .loc__nick{font-family:"Allison",cursive;font-size:54px;color:var(--mustard);line-height:.4;margin-top:6px;display:block;letter-spacing:-.01em}
  .loc__info{margin-top:22px;display:grid;grid-template-columns:auto 1fr;column-gap:18px;row-gap:10px;font-size:14px}
  .loc__info .k{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(250,243,224,.55);padding-top:3px}
  .loc__info .v{line-height:1.5}
  .loc__cta{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
  .loc__cta .btn--cream{background:var(--paper);color:var(--ink)}
  .loc__cta .btn--cream:hover{background:var(--mustard);color:var(--ink)}

  /* STORY */
  .story{padding:90px 0;position:relative}
  .story__grid{display:grid;grid-template-columns: .9fr 1.1fr;gap:60px;align-items:center}
  .story__photos{position:relative;height:600px}
  .story__photos .p{position:absolute;border-radius:18px;background-size:cover;background-position:center;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
  .story__photos .p1{width:64%;height:60%;top:0;left:0;transform:rotate(-3deg);z-index:2}
  .story__photos .p2{width:54%;height:50%;bottom:0;right:0;transform:rotate(2deg);z-index:1}
  .story__photos .stamp{
    position:absolute;bottom:34%;left:50%;width:140px;height:140px;
    background:var(--red);color:var(--paper);border-radius:999px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:"Anton",sans-serif;font-size:18px;line-height:1;letter-spacing:.02em;text-transform:uppercase;
    transform:rotate(-12deg);z-index:5;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:14px;
  }
  .story h2{font-family:"Anton",sans-serif;font-size:clamp(48px,6vw,92px);line-height:.92;text-transform:uppercase}
  .story h2 .script{font-family:"Allison",cursive;color:var(--red);text-transform:none;font-size:1.5em;line-height:.5;display:inline-block;transform:translateY(.2em) rotate(-2deg)}
  .story__body{font-size:16.5px;line-height:1.65;color:var(--ink-2);margin-top:22px;max-width:54ch}
  .story__body p+p{margin-top:14px}
  .story__sig{font-family:"Allison",cursive;color:var(--red);font-size:64px;line-height:.5;margin-top:30px;display:block}
  .story__credit{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(26,20,16,.6);margin-top:6px}

  /* PRESS / quotes */
  .press{background:var(--mustard);color:var(--ink);padding:60px 0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
  .press__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
  .press__q{padding:0 10px}
  .press__q .q{font-family:"Anton",sans-serif;font-size:30px;line-height:1.05;text-transform:uppercase;letter-spacing:-.005em}
  .press__q .cite{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:14px;color:var(--ink-2)}
  .press__q .stars{margin-top:8px;color:var(--red);letter-spacing:3px;font-size:14px}

  /* GALLERY */
  .gallery{padding:90px 0;background:var(--cream)}
  .gallery__head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:30px;gap:30px;flex-wrap:wrap}
  .gallery__head h2{font-family:"Anton",sans-serif;font-size:clamp(48px,6vw,92px);line-height:.92;text-transform:uppercase}
  .gallery__head h2 .script{font-family:"Allison",cursive;color:var(--red);text-transform:none;font-size:1.5em;line-height:.5;display:inline-block;transform:translateY(.2em) rotate(-2deg)}
  .gallery__grid{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:120px;gap:12px}
  .gallery__cell{border-radius:14px;background-size:cover;background-position:center;border:1.5px solid var(--ink);overflow:hidden;position:relative;transition:transform .25s ease}
  .gallery__cell:hover{transform:scale(1.02) rotate(-.5deg)}
  .gallery__cell .tag{position:absolute;bottom:10px;left:10px;background:rgba(26,20,16,.85);color:var(--paper);padding:4px 8px;border-radius:5px;font-family:"Space Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}

  /* NEWSLETTER + FOOTER */
  .news{
    background:var(--red);color:var(--paper);
    padding:80px 0;border-top:2px solid var(--ink);
    position:relative;overflow:hidden;
  }
  .news::before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(45deg, transparent 0 18px, rgba(0,0,0,.04) 18px 19px);
    pointer-events:none;
  }
  .news__inner{display:grid;grid-template-columns: 1fr 1fr;gap:60px;align-items:center}
  .news h2{font-family:"Anton",sans-serif;font-size:clamp(44px,5.5vw,84px);line-height:.92;text-transform:uppercase}
  .news h2 .script{font-family:"Allison",cursive;color:var(--mustard);text-transform:none;font-size:1.4em;line-height:.5;display:inline-block;transform:translateY(.18em) rotate(-2deg)}
  .news p{margin-top:12px;font-size:16px;color:rgba(250,243,224,.85);max-width:42ch}

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script type="text/babel">
// ─── tweaks-panel ─────────────────────────────────────────────────────────────

const __TWEAKS_STYLE = `

  .twk-field{appearance:none;box-sizing:border-box;width:100%;min-width:0;height:26px;padding:0 8px;

    background-repeat:no-repeat;background-position:right 8px center}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

function Cart({open, items, onClose, onInc, onDec}){
  const [mode, setMode] = useState("pickup");
  if (!open) return null;
  const subtotal = items.reduce((s,i)=> s + i.qty * i.price, 0);
  const fee = mode === "delivery" ? 14 : 0;
  return (
    <div className="modal-bg" onClick={onClose}>
      <aside className="modal" onClick={(e)=>e.stopPropagation()}>
        <div className="modal__head">
          <h3>Your bag <span style={{color:"var(--red)"}}>({items.reduce((s,i)=>s+i.qty,0)})</span></h3>
          <button className="modal__close" onClick={onClose}>✕</button>
        </div>
        <div className="modal__body">
          {items.length === 0 ? (
            <div className="empty">
              <span className="script">Hungry?</span>
              <p>Your bag's empty. The Butler Cheese Burger is right over there →</p>
            </div>
          ) : items.map(it => (
            <div key={it.id} className="line">
              <div className="line__img" style={{backgroundImage:`url('${it.photo}')`}}></div>
              <div className="line__info">
                <div className="line__name">{it.name}</div>
                <div className="line__price">₪{it.price} × {it.qty} = ₪{it.qty*it.price}</div>
              </div>
              <div className="line__qty">
                <button onClick={()=>onDec(it.id)}>−</button>
                <span>{it.qty}</span>
                <button onClick={()=>onInc(it.id)}>+</button>
              </div>
            </div>
          ))}
        </div>
        {items.length > 0 && (
          <div className="modal__foot">
            <div className="opts">
              <button className="opt" aria-pressed={mode==="pickup"} onClick={()=>setMode("pickup")}>Pickup · 12 min</button>
              <button className="opt" aria-pressed={mode==="delivery"} onClick={()=>setMode("delivery")}>Delivery · 25 min</button>
            </div>
            {fee > 0 && (
              <div style={{display:"flex",justifyContent:"space-between",fontFamily:"Space Mono,monospace",fontSize:12,letterSpacing:".08em",textTransform:"uppercase",color:"var(--ink-2)",marginBottom:8}}>
                <span>Delivery</span><span>₪{fee}</span>
              </div>
            )}
            <div className="total">
              <span>Total</span>
              <span className="price">₪{subtotal + fee}</span>
            </div>
            <button className="btn btn--red" style={{width:"100%",justifyContent:"center"}}>Checkout · 30 sec <span className="arrow">→</span></button>
          </div>
        )}
      </aside>
    </div>
  );
}

function App(){
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [cartOpen, setCartOpen] = useState(false);
  const [orderOpen, setOrderOpen] = useState(false);
  const [cart, setCart] = useState([]);

  useEffect(()=>{
    document.documentElement.style.setProperty("--red", t.vitrinaRed);
    const accentMap = { peach:"#f1b896", pink:"#ff8aa3", blue:"#2e8fd1", mustard:"#f3b734" };
    document.documentElement.style.setProperty("--pink", accentMap[t.accent] || t.accent);
  }, [t.vitrinaRed, t.accent]);

  const add = (item) => {
    setCart(prev => {
      const found = prev.find(x => x.id === item.id);
      if (found) return prev.map(x => x.id === item.id ? {...x, qty: x.qty+1} : x);
      return [...prev, {...item, qty:1}];
    });
    const cartBtn = document.querySelector(".nav__cart");
    if (cartBtn) {
      cartBtn.animate([{transform:"scale(1)"},{transform:"scale(1.18)"},{transform:"scale(1)"}], {duration:280, easing:"ease-out"});
    }
  };
  const inc = (id) => setCart(prev => prev.map(x => x.id===id ? {...x, qty:x.qty+1} : x));
  const dec = (id) => setCart(prev => prev.map(x => x.id===id ? {...x, qty:Math.max(0,x.qty-1)} : x).filter(x => x.qty>0));
  const cartCount = cart.reduce((s,i)=>s+i.qty,0);

  return (
    <>
      {t.showMarquee && <Marquee />}
      <Nav onCart={()=>setCartOpen(true)} cartCount={cartCount} onOrder={()=>setOrderOpen(true)} />
      <Hero />
      <VStrip />
      <MenuSection onAdd={add} />
      <Locations />
      <Story />
      <Press />
      <Gallery />
      <Newsletter />
      <Footer />
      <Cart open={cartOpen} items={cart} onClose={()=>setCartOpen(false)} onInc={inc} onDec={dec} />
      <LocationPicker open={orderOpen} onClose={()=>setOrderOpen(false)} />

      <TweaksPanel>
        <TweakSection label="Brand" />
        <TweakColor label="Vitrina red" value={t.vitrinaRed}
                    options={["#d12821","#e8442b","#b81a1a","#c8232c","#ff4646"]}
                    onChange={(v)=>setTweak("vitrinaRed", v)} />
        <TweakRadio label="Photo accent" value={t.accent}
                    options={["peach","pink","blue","mustard"]}
                    onChange={(v)=>setTweak("accent", v)} />
        <TweakSection label="Page" />
        <TweakToggle label="Top marquee" value={t.showMarquee}
                     onChange={(v)=>setTweak("showMarquee", v)} />
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
